[package]
name = "rhymr-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk = { version = "0.9.5", package = "gtk4", features = ["v4_12"] }
glib = "0.20.7"
tokio = { version = "1.42.0", features = ["full"] }
datamuse-api-rs = "2.1.0"

[package.metadata.bundle]
name = "Rhymr" # The name of your app as displayed in macOS
identifier = "app.rhymr.macos" # Unique identifier for your app
icon = "assets/icon.icns" # Path to your app's icon in `.icns` format (important for macOS)

[package.metadata.bundle.macos]
frameworks = [] # List macOS frameworks to link, if applicable

[package.metadata.bundle.mac.dmg]
#background = "assets/background.png" # Path to the background image for the DMG
