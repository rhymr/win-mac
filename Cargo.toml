[package]
name = "rhymr-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
# gtk
gtk = { version = "0.9.5", package = "gtk4", features = ["v4_12"] }
sourceview5 = { version = "0.9.1", features = ["gtk_v4_12"] }
glib = { version = "0.20.7" }
gio = { version = "0.20.7" }

# futures
futures-channel = { version = "0.3.31" }
futures-util = { version = "0.3.31" }
tokio = { version = "1.42.0", features = ["full"] }

# misc
datamuse-api-rs = { version = "2.1.1" } # rhyme search api
grass = { version = "0.13.4" } # scss -> css

[build-dependencies]
glib-build-tools = { version = "0.20.0" }
